name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      # Install server dependencies
      - name: Install server dependencies
        run: cd server && npm ci

      # Compile the server to dist/ (the packaged app runs dist, not tsx)
      - name: Build server
        run: cd server && npm run build

      # Install desktop dependencies
      - name: Install desktop dependencies
        run: cd desktop && npm ci

      # Rebuild the server's native modules (better-sqlite3, node-pty, bcrypt)
      # against Electron's ABI: the packaged app runs the server with Electron's
      # own Node (ELECTRON_RUN_AS_NODE), so modules built for the CI's Node would
      # fail to load at runtime (NODE_MODULE_VERSION mismatch).
      - name: Rebuild server native modules for Electron
        shell: bash
        run: |
          cd desktop
          ELECTRON_VER=$(node -p "require('electron/package.json').version")
          echo "Rebuilding ../server native modules for Electron $ELECTRON_VER"
          npx --yes @electron/rebuild@latest --module-dir ../server --version "$ELECTRON_VER" --force

      # Build desktop app
      # On macOS: if Apple Developer secrets are set, the app is signed
      # with Developer ID and notarized with Apple notarytool.
      # Otherwise the build still succeeds producing an unsigned DMG.
      #
      # IMPORTANT: GitHub Actions expands missing secrets to empty strings.
      # electron-builder sees an empty CSC_LINK as "try to use file path ''"
      # which resolves to the cwd — breaking the build with "desktop not a
      # file". We explicitly unset the empty vars before invoking electron.
      - name: Build desktop app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (Developer ID Application certificate, .p12)
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # macOS notarization (via notarytool)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Drop empty signing vars so electron-builder doesn't try to use them
          [ -z "${CSC_LINK:-}" ] && unset CSC_LINK || true
          [ -z "${CSC_KEY_PASSWORD:-}" ] && unset CSC_KEY_PASSWORD || true
          [ -z "${APPLE_ID:-}" ] && unset APPLE_ID || true
          [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && unset APPLE_APP_SPECIFIC_PASSWORD || true
          [ -z "${APPLE_TEAM_ID:-}" ] && unset APPLE_TEAM_ID || true

          cd desktop
          npm run build:web
          npx tsc -p electron/tsconfig.json
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${CSC_LINK:-}" ]; then
            echo "Building macOS app with code signing + notarization"
            npx electron-builder --publish always -c.mac.notarize=true
          else
            echo "Building without macOS signing/notarization"
            npx electron-builder --publish always
          fi

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.yml

  build-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'

      - name: Build APK
        run: |
          cd flutter_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: flutter-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      # Best-effort: also attach the APK to the GitHub release for this tag so
      # it can be downloaded directly (e.g. on a phone). The desktop build
      # creates the draft release early; if it isn't there yet this is a no-op
      # and the APK is still available as a workflow artifact above.
      - name: Attach APK to the release (best-effort)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            flutter_app/build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" --clobber || true

  # Publish the GitHub release ONLY after both desktop builds succeed.
  # electron-builder uploads the installers + latest.yml/latest-mac.yml to a
  # DRAFT release (tagged with the app version, which we keep == the git tag).
  # auto-update (electron-updater) can't see drafts, so we flip it to published
  # here. Depends only on build-desktop, so a failing APK build won't block it.
  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Publish release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false --latest
